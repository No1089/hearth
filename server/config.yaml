# Home Assistant add-on manifest for Hearth (this folder is the add-on).
#
# Option keys are the app's environment variables, lowercased: `ha_shopping_list`
# is HA_SHOPPING_LIST. app.py reads /data/options.json itself and exports each key
# (lists comma-joined, blanks skipped), so there is no run script. What each option
# does is in DOCS.md.
name: Hearth
version: "1.1.0"
slug: hearth
description: "Kitchen wall dashboard for a spare tablet: paintings, the week, shopping list, to-dos, pocket money, the speaker and an on-a-call banner"
url: https://github.com/No1089/hearth
arch:
  - aarch64
  - amd64
# A plain python image with no init of its own, so keep Docker's init (the
# default): it runs as PID 1 and forwards SIGTERM to python, which makes stops
# and updates clean. `init: false` is for images that ship s6-overlay.
init: true
startup: application
boot: auto
# Supervisor token in, no long-lived token to create: the app talks to
# http://supervisor/core and its websocket.
homeassistant_api: true
# No ingress on purpose. Ingress needs a Home Assistant login, which a kiosk
# can't give; the tablet opens http://<home-assistant-ip>:5007 directly.
ports:
  5007/tcp: 5007
ports_description:
  5007/tcp: Hearth web page (what the tablet opens)
webui: "http://[HOST]:[PORT:5007]"
# The Supervisor restarts the app when this stops answering.
watchdog: "http://[HOST]:[PORT:5007]/api/config"
# Home Assistant's media folder, read-only, so a folder of pictures in it can
# be the slideshow (image_dir: /media/hearth). /data is always mapped and is
# where the chores live.
map:
  - type: media
# Not options here: LISTS (the add-on has no TODO_URL, so app.py always picks `ha`)
# and TZ (the Supervisor sets it to Home Assistant's own time zone).
options:
  ha_shopping_list: todo.shopping_list
  ha_todo_lists: []
  todo_first: ""
  todo_hide: ""
  ha_calendars: ""
  ha_busy_entities: ""
  ha_wake_entities: ""
  busy_label: On a call
  music_entity: ""
  music_max_volume: 0.6
  pocket_url: ""
  pocket_pin: ""
  art_url: ""
  immich_url: ""
  immich_api_key: ""
  immich_album_ids: ""
  image_dir: ""
  weather_lat: ""
  weather_lon: ""
schema:
  ha_shopping_list: str
  ha_todo_lists:
    - str
  todo_first: "str?"
  todo_hide: "str?"
  ha_calendars: "str?"
  ha_busy_entities: "str?"
  ha_wake_entities: "str?"
  busy_label: str
  music_entity: "str?"
  music_max_volume: "float(0,1)"
  pocket_url: "str?"
  pocket_pin: "password?"
  art_url: "str?"
  immich_url: "str?"
  immich_api_key: "password?"
  immich_album_ids: "str?"
  image_dir: "str?"
  weather_lat: "str?"
  weather_lon: "str?"
