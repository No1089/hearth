<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<style>
:root {
  --bg: #f6f1e8; --panel: #fffdf8; --ink: #2a2622; --dim: #7a7166; --faint: #b9b0a3;
  --line: #e7dfd2; --accent: #2f6f62; --accent-ink: #fff; --busy: #e1140a;
  --chip: #efe7da; --shadow: 0 1px 2px rgba(60,40,20,.08), 0 4px 14px rgba(60,40,20,.06);
  --c1: #e4572e; --c2: #2f80a8; --c3: #8a5cc2; --c4: #3c9d5d; --c5: #d8a01e; --c6: #c2477f;
}
body.night {
  --bg: #15130f; --panel: #1f1c17; --ink: #ece5d8; --dim: #9a9083; --faint: #5d564c;
  --line: #2e2a23; --accent: #6fb7a5; --accent-ink: #10201c; --chip: #2a2620;
  --shadow: 0 1px 2px rgba(0,0,0,.4);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--ink);
  font-family: system-ui, Roboto, "Segoe UI", sans-serif; font-size: clamp(15px, 1.7vw, 22px);
  -webkit-user-select: none; user-select: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
input { font: inherit; color: inherit; }
svg { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 2;
  stroke-linecap: round; stroke-linejoin: round; flex: none; }
.hidden { display: none !important; }

/* ── busy banner (both modes) ─────────────────────────── */
#busy { position: fixed; z-index: 50; right: 16px; top: 16px; transform: translateY(-260%);
  transition: transform .5s cubic-bezier(.2,.9,.3,1.2); background: #e1140a; color: #fff;
  border-radius: 999px; padding: .6em 1.4em .6em 1.1em; display: flex; align-items: center; gap: .65em;
  font-weight: 800; font-size: 1.65rem; box-shadow: 0 8px 30px rgba(225,20,10,.5); white-space: nowrap;
  pointer-events: none; }
body.busy #busy { transform: translateY(0); }
#busy .dot { width: .7em; height: .7em; border-radius: 50%; background: #fff; animation: pulse 1.6s infinite; }
#busy small { font-weight: 500; opacity: .85; font-size: .75em; }
/* ── HA alert pills (e.g. geyser shed for load) ────────── */
.alerts { display: flex; gap: .5em; flex-wrap: wrap; }
.alerts:empty { display: none; }
.alerts .al { display: flex; align-items: center; gap: .45em; background: #e8890c; color: #fff; border-radius: 999px;
  padding: .35em .9em .35em .7em; font-weight: 700; font-size: .85rem; white-space: nowrap; box-shadow: 0 3px 12px rgba(232,137,12,.35); }
.alerts .al svg { font-size: 1.15em; }
.alerts .al small { font-weight: 500; opacity: .85; }
#saver-alerts { position: absolute; z-index: 3; top: 1.1em; left: 50%; transform: translateX(-50%); font-size: 1.15rem; }
/* during a call the banner owns the top-right corner: alerts drop to just below it (banner ≈ 4.25rem tall) */
body.busy #saver-alerts, body.busy #dash-alerts { position: fixed; z-index: 50; left: auto; right: 16px; transform: none;
  top: calc(16px + 4.25rem + .5rem); justify-content: flex-end; font-size: 1rem; }
@keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.75); } }

/* ── screensaver ──────────────────────────────────────── */
#saver { position: fixed; inset: 0; background: #000; color: #eee; z-index: 10; }
#saver > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain;
  opacity: 0; transition: opacity 1.4s ease; }
#saver > img.cover { object-fit: cover; }
#saver > img.on { opacity: 1; }
#saver .meta { position: absolute; left: 0; right: 0; bottom: 0; display: flex; align-items: flex-end;
  justify-content: space-between; gap: 2em; padding: 3em 1.6em 1.2em;
  background: linear-gradient(to top, rgba(0,0,0,.78), rgba(0,0,0,.35) 60%, transparent); }
#caption { font-family: Georgia, "Times New Roman", serif; min-width: 0; transition: opacity .8s; }
#caption .a { font-size: 1.1rem; }
#caption .t { font-style: italic; color: #bbb; font-size: .9rem; margin-top: .15em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#saver .clock { text-align: right; flex: none; }
#saver .clock .time { font-size: 3.4rem; font-weight: 300; line-height: 1; letter-spacing: -.02em; }
#saver .clock .sub { color: #bbb; font-size: .95rem; margin-top: .3em; display: flex; gap: .5em;
  justify-content: flex-end; align-items: center; }
#saver .hint { position: absolute; top: 1.2em; right: 1.4em; font-size: .8rem; color: rgba(255,255,255,.35); }

/* ── dashboard ────────────────────────────────────────── */
#dash { position: fixed; inset: 0; display: grid; grid-template-columns: 6.4em 1fr; grid-template-rows: auto 1fr; }
header { grid-column: 1 / 3; display: flex; align-items: center; gap: 1.2em; padding: .7em 1.2em .5em 1.4em; }
header .time { font-size: 2.3rem; font-weight: 300; letter-spacing: -.02em; line-height: 1; }
header .date { font-size: 1.05rem; color: var(--dim); flex: 1; }
header .wx { display: flex; align-items: center; gap: .45em; font-size: 1.15rem; }
header .wx svg { font-size: 1.5em; }
header .wx small { color: var(--dim); font-size: .8em; }
header .art-btn { width: 2.6em; height: 2.6em; border-radius: 50%; display: grid; place-items: center;
  background: var(--chip); color: var(--dim); font-size: 1.05rem; }
nav { display: flex; flex-direction: column; gap: .5em; padding: .4em .6em 1em 1em; }
nav button { display: flex; flex-direction: column; align-items: center; gap: .3em; padding: .8em .2em;
  border-radius: 18px; color: var(--dim); font-size: .82rem; font-weight: 600; transition: background .2s, color .2s; }
nav button svg { font-size: 1.9em; stroke-width: 1.8; }
nav button.on { background: var(--panel); color: var(--accent); box-shadow: var(--shadow); }
nav button .badge { font-size: .8em; background: var(--accent); color: var(--accent-ink); border-radius: 999px;
  padding: 0 .5em; margin-top: -.2em; }
main { position: relative; min-height: 0; padding: .3em 1.2em 1.1em .2em; }
.view { height: 100%; }

/* week */
#week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: .45em; }
.day { background: var(--panel); border-radius: 16px; box-shadow: var(--shadow); display: flex;
  flex-direction: column; min-height: 0; overflow: hidden; }
.day h3 { padding: .5em .6em .4em; font-size: .8rem; font-weight: 600; color: var(--dim);
  border-bottom: 1px solid var(--line); }
.day h3 .row { display: flex; align-items: center; justify-content: space-between; gap: .3em; margin-top: .1em; }
.day h3 b { font-size: 1.9em; font-weight: 300; color: var(--ink); line-height: 1; }
.day h3 .wxd { font-weight: 500; font-size: .95em; display: flex; align-items: center; gap: .2em; color: var(--dim); }
.day h3 .wxd svg { font-size: 1.3em; }
.day.today { outline: 3px solid var(--accent); outline-offset: -3px; }
.day.today h3 { color: var(--accent); }
.day .evs { flex: 1; overflow-y: auto; padding: .45em; display: flex; flex-direction: column; gap: .35em; }
.ev { border-radius: 10px; padding: .35em .5em .4em; background: color-mix(in srgb, var(--c) 14%, var(--panel));
  border-left: 4px solid var(--c); font-size: .8rem; line-height: 1.25; }
.ev .tm { font-weight: 700; color: color-mix(in srgb, var(--c) 75%, var(--ink)); font-size: .9em; }
.ev .ti { font-weight: 500; overflow-wrap: anywhere; }
.ev.all { background: var(--c); color: #fff; border-left: 0; font-weight: 600; }
.ev.past { opacity: .45; }
.day .none { color: var(--faint); font-size: .8rem; text-align: center; margin-top: 1em; }
.empty-note { grid-column: 1 / -1; align-self: center; text-align: center; color: var(--dim); }
.legend { display: flex; gap: .9em; font-size: .8rem; color: var(--dim); }
.legend i { display: inline-block; width: .7em; height: .7em; border-radius: 3px; margin-right: .35em; background: var(--c); }

/* lists */
.listview { display: grid; grid-template-columns: 1.35fr 1fr; gap: 1em; }
.listview.single { grid-template-columns: 1fr; }
.headrow { display: flex; align-items: center; gap: 1em; }
.headrow h2 { flex: none; }
.headrow .add { flex: 1; max-width: 26em; margin-left: auto; }
.card { background: var(--panel); border-radius: 18px; box-shadow: var(--shadow); min-height: 0;
  display: flex; flex-direction: column; overflow: hidden; }
.card h2 { font-size: 1.15rem; padding: .8em 1em .5em; display: flex; align-items: center; gap: .5em; }
.card h2 .n { color: var(--dim); font-weight: 500; font-size: .85em; }
.items { flex: 1; overflow-y: auto; padding: 0 .5em .6em; }
.item { display: flex; align-items: center; gap: .8em; padding: .7em .6em; border-radius: 12px;
  font-size: 1.15rem; transition: opacity .3s, background .2s; }
.item + .item { border-top: 1px solid var(--line); }
.item .box { width: 1.5em; height: 1.5em; border-radius: 8px; border: 2.5px solid var(--faint);
  display: grid; place-items: center; flex: none; color: transparent; transition: all .2s; }
.item.ticked .box { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.item.ticked .tx { text-decoration: line-through; color: var(--dim); }
.item.gone { opacity: 0; }
.items .none, .lights .none, .plants .none { color: var(--faint); text-align: center; padding: 2.5em 1em; font-size: 1.05rem; }
.side { display: flex; flex-direction: column; gap: 1em; min-height: 0; }
.add { display: flex; gap: .5em; padding: .8em; }
.add input { flex: 1; min-width: 0; border: 2px solid var(--line); background: var(--bg); border-radius: 12px;
  padding: .55em .8em; font-size: 1.1rem; outline: none; -webkit-user-select: text; user-select: text; }
.add input:focus { border-color: var(--accent); }
.btn { background: var(--accent); color: var(--accent-ink); border-radius: 12px; padding: .55em 1em;
  font-weight: 700; display: inline-flex; align-items: center; gap: .4em; }
.btn.ghost { background: var(--chip); color: var(--ink); }
.chips { padding: 0 .8em .9em; display: flex; flex-wrap: wrap; gap: .45em; overflow-y: auto; align-content: flex-start; }
.chips .lbl { width: 100%; font-size: .8rem; color: var(--dim); margin-bottom: .1em; }
.chip { background: var(--chip); border-radius: 999px; padding: .4em .85em; font-size: .95rem; }
.chip:active { background: var(--accent); color: var(--accent-ink); }
.actions { padding: .8em; display: flex; gap: .5em; margin-top: auto; }

/* battery (only shown when unplugged) */
.batt { display: inline-flex; align-items: center; gap: .35em; font-size: .9rem; font-weight: 700; color: var(--dim); }
.batt .cell { width: 1.7em; height: .85em; border: 2px solid currentColor; border-radius: 3px; position: relative; padding: 1px; }
.batt .cell::after { content: ""; position: absolute; right: -4px; top: 50%; width: 2px; height: 40%; transform: translateY(-50%); background: currentColor; border-radius: 0 1px 1px 0; }
.batt .cell i { display: block; height: 100%; background: currentColor; border-radius: 1px; }
.batt.low { color: var(--busy); }
#saver .batt { color: #ccc; font-size: .8rem; }
#saver .batt.low { color: #ff6b5e; }

/* to-do sections */
.tabs { display: flex; gap: .4em; padding: .8em .8em 0; overflow-x: auto; scrollbar-width: none; flex: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { flex: none; padding: .4em .85em; border-radius: 999px; background: var(--chip); font-size: .85rem; font-weight: 600; color: var(--dim); }
.tabs button.on { background: var(--accent); color: var(--accent-ink); }
.tabs button i { font-style: normal; opacity: .7; margin-left: .3em; }
.tabs .sep { width: 1px; background: var(--line); flex: none; margin: .2em .2em; }
.chips.sugg { flex: none; max-height: 7.5em; padding-top: .3em; border-top: 1px solid var(--line); }
.chips.sugg:empty { display: none; }

/* pocket */
#v-pocket { overflow-y: auto; }
.pocket-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(16em, 1fr)); gap: 1em; min-height: 100%; }
.kid { background: var(--panel); border-radius: 18px; box-shadow: var(--shadow); padding: 1em 1.1em; display: flex; flex-direction: column; gap: .7em; }
.kid-head { display: flex; align-items: baseline; gap: .6em; }
.kid-head h2 { font-size: 1.4rem; }
.kid-head .bal { margin-left: auto; font-size: 1.9rem; font-weight: 300; letter-spacing: -.02em; }
.kid-head .kprint { margin-left: -.3em; }
.kid-head .gear { width: 2em; height: 2em; border-radius: 50%; display: grid; place-items: center; color: var(--faint); align-self: center; }
.goal { font-size: .85rem; }
.goal .gl { display: flex; justify-content: space-between; color: var(--dim); margin-bottom: .25em; }
.goal .gl b { color: var(--ink); font-weight: 600; }
.goal .gb { height: .55em; background: var(--chip); border-radius: 999px; overflow: hidden; }
.goal .gb i { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
.chores { display: flex; flex-direction: column; gap: .1em; }
.chores .lbl { font-size: .75rem; text-transform: uppercase; letter-spacing: .07em; color: var(--dim); font-weight: 700; margin-bottom: .2em; }
.chore { display: flex; align-items: center; gap: .7em; padding: .45em .2em; font-size: 1.05rem; text-align: left; }
.chore .box { width: 1.4em; height: 1.4em; border-radius: 7px; border: 2.5px solid var(--faint); display: grid; place-items: center; color: transparent; flex: none; }
.chore.on .box { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.chore.on .t { color: var(--dim); text-decoration: line-through; }
.chores .none { color: var(--faint); font-size: .9rem; }
.kid .credit { margin-top: auto; justify-content: center; padding: .7em 1em; }
.kid .credited { margin-top: auto; text-align: center; color: var(--accent); font-weight: 700; padding: .6em; border-radius: 12px; background: color-mix(in srgb, var(--accent) 12%, transparent); }

/* modals */
.modal { position: fixed; inset: 0; z-index: 70; background: rgba(0,0,0,.45); display: grid; place-items: center; }
.sheet { background: var(--panel); border-radius: 22px; padding: 1.2em; box-shadow: 0 20px 60px rgba(0,0,0,.35); }
.pinpad { width: 17em; text-align: center; }
.pin-title { font-weight: 700; font-size: 1.1rem; }
.pin-dots { height: 1.6em; margin: .5em 0 .8em; font-size: 1.4rem; letter-spacing: .4em; color: var(--accent); }
.pin-dots.bad { color: var(--busy); animation: shake .35s; }
@keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
.keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: .5em; }
.keys button { height: 2.8em; border-radius: 14px; background: var(--chip); font-size: 1.3rem; font-weight: 600; }
.keys button:active { background: var(--line); }
.keys .ok { background: var(--accent); color: var(--accent-ink); font-size: 1rem; }
.pin-cancel { margin-top: .8em; color: var(--dim); font-weight: 600; padding: .4em 1em; }
.editor { width: min(28em, 90vw); max-height: 90vh; display: flex; flex-direction: column; gap: .5em; }
.editor h2 { font-size: 1.15rem; }
#ce-list { overflow-y: auto; display: flex; flex-direction: column; gap: .3em; }
.ce-row { display: flex; align-items: center; gap: .5em; padding: .45em .6em; background: var(--bg); border-radius: 10px; }
.ce-row span { flex: 1; }
.ce-row button { color: var(--faint); width: 2em; height: 2em; display: grid; place-items: center; border-radius: 50%; }
.editor .add { padding: 0; }
.editor .actions { padding: 0; justify-content: flex-end; }

/* screensaver music pill */
#saver-music { position: absolute; z-index: 2; top: 1em; left: 1em; width: min(21em, 44vw); display: flex; flex-direction: column;
  gap: .8em; background: rgba(0,0,0,.62); color: #eee; border-radius: 20px; padding: 1em;
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); animation: fadein .25s ease; }
@keyframes fadein { from { opacity: 0; transform: translateY(-6px); } }
#saver-music .sm-top { display: flex; align-items: center; gap: .8em; min-width: 0; }
#saver-music img { width: 3.6em; height: 3.6em; border-radius: 10px; object-fit: cover; background: #333; flex: none; }
#saver-music img:not([src]) { visibility: hidden; }
#saver-music .sm-text { display: flex; flex-direction: column; min-width: 0; line-height: 1.25; }
#saver-music b, #saver-music small { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#saver-music b { font-size: 1rem; } #saver-music small { font-size: .85rem; color: #aaa; }
#saver-music button { color: #eee; }
#saver-music .sm-ctl { display: flex; justify-content: center; align-items: center; gap: 1.4em; }
#saver-music .sm-ctl button { font-size: 1.5rem; width: 2em; height: 2em; display: grid; place-items: center; border-radius: 50%; }
#saver-music .sm-ctl button:active { background: rgba(255,255,255,.15); }
#saver-music .sm-ctl .sm-pp { background: #fff; color: #111; width: 2.3em; height: 2.3em; font-size: 1.7rem; }
#saver-music .sm-vol { display: flex; align-items: center; gap: .7em; }
#saver-music .sm-vol button { width: 2.1em; height: 2.1em; border-radius: 50%; background: rgba(255,255,255,.14); font-size: 1.25rem; font-weight: 700; flex: none; }
#saver-music .sm-vol .bar { flex: 1; height: .55em; border-radius: 999px; background: rgba(255,255,255,.18); overflow: hidden; }
#saver-music .sm-vol .bar i { display: block; height: 100%; width: 0; background: #fff; border-radius: 999px; transition: width .3s; }

/* home: lights + plants */
#v-home { display: grid; grid-template-columns: 1.5fr 1fr; gap: 1em; }
#v-home.hidden { display: none; }
#v-home { grid-template-columns: 1.9fr 1fr; }
.lights { flex: 1; overflow-y: auto; padding: .3em .9em 1em; display: flex; flex-direction: column; gap: 1em; }
.lhead { display: flex; align-items: center; gap: .5em; padding: .5em .1em .55em; }
.lhead h2 { padding: 0; font-size: 1.15rem; }
.lhead .all { margin-left: auto; display: flex; gap: .4em; }
.lhead .all .btn { padding: .4em .85em; font-size: .88rem; }
.lgrid { display: grid; gap: .7em; grid-template-columns: repeat(auto-fill, minmax(9em, 1fr)); }
.media { padding: .1em .9em 1em; display: grid; gap: .7em; }
.mp { border-radius: 16px; background: var(--chip); display: flex; align-items: center; gap: .8em; padding: .7em .8em .7em 1em; }
.mp .tx { flex: 1; min-width: 0; }
.mp .nm { font-weight: 700; font-size: 1.1rem; }
.mp .st { color: var(--dim); font-size: .9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mp button { width: 3.2em; height: 3.2em; border-radius: 50%; display: grid; place-items: center; font-size: 1.3rem;
  background: var(--accent); color: var(--accent-ink); flex: none; }
.mp.na { opacity: .5; } .mp.na button { background: var(--faint); }
.light { border-radius: 16px; background: var(--chip); display: flex; flex-direction: column; overflow: hidden;
  transition: background .25s, opacity .25s; }
.light .tap { display: flex; align-items: center; gap: .5em; padding: .9em .7em; text-align: left; min-width: 0; width: 100%; }
.light .tap > span:last-child { min-width: 0; flex: 1; }
.light .nm, .light .st { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.light .ic { width: 2.1em; height: 2.1em; border-radius: 50%; display: grid; place-items: center; font-size: 1rem;
  background: var(--panel); color: var(--faint); flex: none; transition: all .25s; }
.light .nm { font-weight: 700; font-size: 1rem; line-height: 1.2; }
.light .st { color: var(--dim); font-size: .9rem; }
.light.on { background: color-mix(in srgb, #f2b33d 22%, var(--panel)); }
.light.on .ic { background: #f2b33d; color: #3a2a05; box-shadow: 0 0 18px rgba(242,179,61,.55); }
.light.na { opacity: .45; }
.light .dim { height: 2.6em; margin: 0 .7em .8em; border-radius: 12px; background: var(--panel); position: relative;
  overflow: hidden; touch-action: none; }
.light .dim i { position: absolute; inset: 0 auto 0 0; width: 0; background: #f2b33d; opacity: .8; transition: width .15s; }
.light:not(.on) .dim i { background: var(--faint); opacity: .35; }
.light .dim b { position: absolute; right: .8em; top: 50%; transform: translateY(-50%); font-size: .85rem; color: var(--ink); }
.light { position: relative; }
.light .ctl { display: flex; gap: .5em; margin: 0 .7em .8em; }
.light .ctl .dim { flex: 1; margin: 0; }
.light .clr { width: 2.6em; height: 2.6em; border-radius: 12px; flex: none; margin-left: auto;
  display: grid; place-items: center; background: var(--panel); }
.light .clr i { width: 1.3em; height: 1.3em; border-radius: 50%; border: 2px solid var(--line);
  background: conic-gradient(#ffb3c6, #ffe0a8, #fff3a8, #b8f2d0, #b3dcff, #d4c2ff, #ffb3c6); }
.light .mode { width: 2.6em; height: 2.6em; border-radius: 12px; flex: none; display: grid; place-items: center;
  background: var(--panel); color: var(--dim); }
.light .mode svg { font-size: 1.3em; }
.light.wide { grid-column: span 2; }
.light.moon { background: color-mix(in srgb, #8fa3d9 24%, var(--panel)); }

.fx button { padding: .55em 1em; border-radius: 999px; background: var(--chip); font-weight: 600; text-transform: capitalize; }
.fx button.cur { background: var(--accent); color: #fff; }
.swsheet .now { font-size: .9rem; color: var(--dim); }
.nightbar { display: flex; justify-content: flex-end; padding: .2em .1em 0; }
.nightbar .btn { display: inline-flex; align-items: center; gap: .4em; padding: .45em 1em; font-size: .92rem; }
.nightbar .btn.arm { background: #8fa3d9; color: #10182e; }
.plants { flex: 1; overflow-y: auto; padding: .2em .9em 1em; display: grid; gap: .8em; align-content: start; }
.plant { border-radius: 16px; background: var(--chip); padding: .9em 1em; display: grid; gap: .45em;
  grid-template-columns: 1fr auto; align-items: center; }
.plant .nm { font-weight: 700; font-size: 1.1rem; display: flex; align-items: center; gap: .45em; }
.plant .nm svg { color: var(--c4); font-size: 1.2em; }
.plant .pc { font-size: 1.9rem; font-weight: 300; text-align: right; line-height: 1; }

.plant .bar { grid-column: 1 / 3; height: .55em; border-radius: 999px; background: var(--panel); overflow: hidden; }
.plant .bar i { display: block; height: 100%; border-radius: 999px; background: var(--c2); transition: width .4s; }
.plant .meta { grid-column: 1 / 3; color: var(--dim); font-size: .9rem; display: flex; gap: 1em; flex-wrap: wrap; }
.plant.dry { background: color-mix(in srgb, var(--c1) 14%, var(--panel)); }

.plant.dry .meta .thirsty { color: var(--c1); font-weight: 700; }

/* music */
.card h2 .refresh { margin-left: auto; width: 2.2em; height: 2.2em; border-radius: 50%; background: var(--chip);
  display: grid; place-items: center; color: var(--dim); }
.card h2 .refresh.spin svg { animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.item .tx { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.item .del { width: 2.2em; height: 2.2em; border-radius: 50%; display: grid; place-items: center; color: var(--faint);
  flex: none; font-size: .9em; }
.item .del:active { background: var(--chip); color: var(--busy); }
.item.ticked .del { visibility: hidden; }
#v-music { display: grid; grid-template-columns: 1fr 1.25fr; gap: 1em; }
#v-music.hidden { display: none; }
.np { padding: 1.1em; align-items: center; justify-content: center; gap: .9em; text-align: center; }
.np .art { width: min(13em, 34vh); aspect-ratio: 1; border-radius: 16px; background: var(--chip); position: relative;
  overflow: hidden; display: grid; place-items: center; color: var(--faint); }
.np .art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.np .art img[src=""], .np .art img:not([src]) { display: none; }
.np .art .ph { font-size: 3.5em; }
.np-room { font-size: .75rem; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); font-weight: 700; }
.np-title { font-size: 1.2rem; font-weight: 700; margin-top: .15em; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.np-artist { color: var(--dim); font-size: .95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 22em; }
.np-ctl { display: flex; align-items: center; gap: 1.2em; }
.np-ctl button { font-size: 1.7rem; width: 2em; height: 2em; display: grid; place-items: center; border-radius: 50%; }
.np-ctl button:active { background: var(--chip); }
.np-ctl .pp { font-size: 2rem; width: 2.4em; height: 2.4em; background: var(--accent); color: var(--accent-ink); }
.vol { display: flex; align-items: center; gap: .7em; width: 100%; max-width: 20em; }
.vol button { width: 2.2em; height: 2.2em; border-radius: 50%; background: var(--chip); font-size: 1.3rem; font-weight: 700; flex: none; }
.vol .bar { flex: 1; height: .7em; border-radius: 999px; background: var(--chip); overflow: hidden; }
.vol .bar i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 999px; transition: width .3s; }
.np.off { opacity: .55; }
.spk { display: flex; flex-wrap: wrap; justify-content: center; gap: .45em; }
.spk button { padding: .45em 1em; border-radius: 999px; background: var(--chip); color: var(--dim); font-weight: 600; font-size: .9rem;
  display: flex; align-items: center; gap: .4em; transition: background .2s, color .2s; }
.spk button.on { background: var(--accent); color: var(--accent-ink); }
.spk button:disabled { opacity: .4; }
.spk button svg { font-size: .95em; }
.favs { min-height: 0; }
.fav-grid { flex: 1; overflow-y: auto; padding: 0 .8em .9em; display: grid; grid-template-columns: repeat(auto-fill, minmax(8.2em, 1fr));
  gap: .7em; align-content: start; }
.fav { display: flex; flex-direction: column; gap: .35em; text-align: left; }
.fav .th { aspect-ratio: 1; border-radius: 12px; background: var(--chip) center / cover no-repeat; display: grid; place-items: center;
  color: var(--faint); font-size: 1.8em; transition: transform .15s; }
.fav:active .th { transform: scale(.95); }
.fav .nm { font-size: .8rem; font-weight: 600; line-height: 1.2; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.fav-grid .none { grid-column: 1 / -1; color: var(--dim); font-size: .9rem; padding: 1em 0; }
nav .eq { display: flex; gap: 2px; align-items: flex-end; height: .8em; }
nav .eq i { width: 3px; background: var(--accent); border-radius: 2px; animation: eq 1s infinite ease-in-out; }
nav .eq i:nth-child(2) { animation-delay: -.4s; } nav .eq i:nth-child(3) { animation-delay: -.7s; }
@keyframes eq { 0%,100% { height: 30%; } 50% { height: 100%; } }

/* recipes */
#v-recipes { min-height: 0; }
.rlib { display: grid; grid-template-columns: 1fr 1.6fr; gap: 1em; height: 100%; }
.rnew { padding: 1em 1.1em; gap: .8em; }
.rnew h2 { padding: 0; }
.rnew textarea { font: inherit; color: inherit; width: 100%; min-height: 5.2em; resize: none; border: 2px solid var(--line);
  background: var(--bg); border-radius: 14px; padding: .65em .8em; font-size: 1.1rem; outline: none;
  -webkit-user-select: text; user-select: text; }
.rnew textarea:focus { border-color: var(--accent); }
.rnew .row { display: flex; gap: .5em; flex-wrap: wrap; }
.rnew .row .btn { flex: 1; justify-content: center; padding: .7em .8em; }
.rnew .hint { color: var(--dim); font-size: .85rem; line-height: 1.4; }
.rnew .busy { display: flex; align-items: center; gap: .7em; color: var(--accent); font-weight: 700; }
.rnew .busy svg { animation: spin .9s linear infinite; font-size: 1.3em; }
.rgrid { flex: 1; overflow-y: auto; padding: 0 .9em 1em; display: grid; grid-template-columns: repeat(auto-fill, minmax(9.5em, 1fr));
  gap: .8em; align-content: start; grid-auto-rows: max-content; }
.rcard { text-align: left; border-radius: 16px; background: var(--chip); overflow: hidden; display: flex; flex-direction: column; }
.rcard .ph { aspect-ratio: 4 / 3; background: color-mix(in srgb, var(--c5) 20%, var(--panel)) center / cover no-repeat;
  display: grid; place-items: center; color: var(--faint); font-size: 2.2em; }
.rcard .tx { padding: .55em .7em .7em; }
.rcard .nm { font-weight: 700; font-size: .95rem; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.rcard .mt { color: var(--dim); font-size: .8rem; margin-top: .2em; }
.rgrid h2 { grid-column: 1 / -1; padding: .8em 0 0; }
.rgrid h2 small { color: var(--dim); font-weight: 500; font-size: .7em; margin-left: .4em; }
.rcard.recent { opacity: .85; }
.rkind { grid-column: 1 / -1; display: flex; gap: .4em; padding-top: .9em; }
.rkind button { padding: .45em 1.1em; border-radius: 999px; background: var(--chip); font-weight: 700; color: var(--dim); }
.rkind button.on { background: var(--accent); color: var(--accent-ink); }
.ev[data-recipe] { cursor: pointer; }
.ev[data-recipe] .ti::before { content: "🍽 "; }
.plan-days { display: grid; grid-template-columns: repeat(4, 1fr); gap: .5em; }
.plan-days button, .plan-meals button { padding: .6em .4em; border-radius: 12px; background: var(--chip); font-weight: 700; font-size: .95rem; }
.plan-days button.on, .plan-meals button.on { background: var(--accent); color: var(--accent-ink); }
.plan-days button small { display: block; font-weight: 500; font-size: .8em; opacity: .8; }
.plan-meals { display: flex; gap: .5em; }
.plan-meals button { flex: 1; }
.rphoto { display: flex; gap: .5em; align-items: center; color: var(--dim); font-size: .85rem; line-height: 1.4; border-top: 1px solid var(--line); padding-top: .8em; }
.rphoto .btn { flex: none; }
.rgrid .none { grid-column: 1 / -1; color: var(--dim); padding: 2em 1em; text-align: center; }
.rview { display: grid; grid-template-rows: auto 1fr; gap: .8em; height: 100%; }
.rhead { display: flex; align-items: center; gap: .6em; flex-wrap: wrap; }
.rhead .back { width: 2.6em; height: 2.6em; border-radius: 50%; background: var(--panel); box-shadow: var(--shadow); display: grid; place-items: center; font-size: 1.05rem; }
.rhead h2 { font-size: 1.35rem; flex: 1; min-width: 8em; line-height: 1.2; }
.rhead h2 small { display: block; font-size: .7em; color: var(--dim); font-weight: 500; margin-top: .15em; }
.rhead .btn { padding: .55em .9em; }
.scale { display: flex; align-items: center; gap: .3em; background: var(--panel); border-radius: 999px; box-shadow: var(--shadow); padding: .2em; }
.scale button { width: 2.2em; height: 2.2em; border-radius: 50%; background: var(--chip); font-weight: 800; font-size: 1.1rem; }
.scale span { min-width: 4.6em; text-align: center; font-weight: 700; font-size: .9rem; }
.rbody { display: grid; grid-template-columns: 1fr 1.55fr; gap: 1em; min-height: 0; }
.rbody .card { overflow-y: auto; padding-bottom: .8em; }
.rbody h3 { font-size: .8rem; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); padding: .9em 1.1em .3em; }
.ing { display: flex; gap: .7em; align-items: flex-start; padding: .5em 1.1em; font-size: 1.1rem; line-height: 1.35; text-align: left; width: 100%; }
.ing .box { width: 1.3em; height: 1.3em; margin-top: .1em; border-radius: 7px; border: 2.5px solid var(--faint); display: grid; place-items: center; color: transparent; flex: none; }
.ing.on .box { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.ing.on .t { color: var(--dim); text-decoration: line-through; }
.ing b { font-weight: 700; }
.step { display: flex; gap: .8em; padding: .7em 1.1em; text-align: left; width: 100%; font-size: 1.1rem; line-height: 1.45; border-radius: 12px; }
.step .n { width: 1.8em; height: 1.8em; border-radius: 50%; background: var(--chip); display: grid; place-items: center; font-weight: 800; font-size: .9rem; flex: none; }
.step.cur { background: color-mix(in srgb, var(--accent) 10%, transparent); }
.step.cur .n { background: var(--accent); color: var(--accent-ink); }
.step.done { opacity: .5; }
.tmr { display: inline-flex; align-items: center; gap: .3em; background: color-mix(in srgb, var(--c5) 22%, var(--panel)); color: var(--ink);
  border-radius: 999px; padding: 0 .55em; font-weight: 700; white-space: nowrap; }
.tmr svg { font-size: .9em; }
.rnote { margin: .2em 1.1em .4em; padding: .6em .8em; border-radius: 12px; background: color-mix(in srgb, var(--c2) 12%, var(--panel)); font-size: .9rem; line-height: 1.4; }
.rtips { padding: 0 1.1em; display: grid; gap: .4em; font-size: .95rem; color: var(--dim); line-height: 1.4; }
.rsrc { padding: .8em 1.1em 0; font-size: .8rem; color: var(--faint); overflow-wrap: anywhere; }
/* cook mode: one step at a time, big */
#cook { position: fixed; inset: 0; z-index: 40; background: var(--bg); display: grid; grid-template-rows: auto 1fr auto; padding: 1em 1.4em 1.2em; gap: 1em; }
#cook .top { display: flex; align-items: center; gap: 1em; }
#cook .top .t { flex: 1; font-weight: 700; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#cook .top button { width: 2.8em; height: 2.8em; border-radius: 50%; background: var(--chip); display: grid; place-items: center; font-size: 1.1rem; }
#cook .top .ingb { width: auto; padding: 0 1.1em; border-radius: 999px; font-weight: 700; font-size: .95rem; }
#cook .mid { display: grid; grid-template-columns: 1fr; align-content: safe center; gap: .8em; min-height: 0; overflow-y: auto; }
#cook .mid.withings { grid-template-columns: 1fr 2fr; align-items: start; }
#cook .sec { color: var(--accent); font-weight: 800; text-transform: uppercase; letter-spacing: .08em; font-size: .9rem; }
#cook .num { color: var(--dim); font-weight: 700; }
#cook .txt { font-size: clamp(1.6rem, 3.3vw, 2.6rem); line-height: 1.35; font-weight: 500; }
#cook .txt .tmr { font-size: .8em; padding: .05em .55em; }
#cook .ings { background: var(--panel); border-radius: 18px; box-shadow: var(--shadow); padding: .5em 0; max-height: 100%; overflow-y: auto; }
#cook .bot { display: grid; grid-template-columns: 1fr auto 1fr; gap: 1em; align-items: center; }
#cook .bot .btn { justify-content: center; padding: 1em; font-size: 1.2rem; border-radius: 16px; }
#cook .dots { display: flex; gap: .35em; flex-wrap: wrap; justify-content: center; max-width: 40vw; }
#cook .dots i { width: .6em; height: .6em; border-radius: 50%; background: var(--line); }
#cook .dots i.on { background: var(--accent); }
/* running timers: a strip over everything (bar the busy banner) */
#timers { position: fixed; z-index: 45; left: 50%; transform: translateX(-50%); bottom: 1em; display: flex; gap: .6em; flex-wrap: wrap; justify-content: center; }
#timers:empty { display: none; }
#timers button { display: flex; align-items: center; gap: .5em; background: var(--ink); color: var(--bg); border-radius: 999px; padding: .55em 1em .55em .8em;
  font-weight: 800; font-size: 1.15rem; box-shadow: 0 6px 22px rgba(0,0,0,.3); font-variant-numeric: tabular-nums; }
#timers button small { font-weight: 500; opacity: .75; font-size: .75em; max-width: 12em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#timers button.ring { background: var(--busy); color: #fff; animation: pulse 1s infinite; }
body.timing #toast { bottom: 5em; }
.sheet.rsheet { width: min(32em, 92vw); max-height: 88vh; display: flex; flex-direction: column; gap: .8em; }
.rsheet h2 { font-size: 1.15rem; }
.rsheet .chips { padding: 0; }
.rsheet .items { padding: 0; max-height: 50vh; }
.rsheet .actions { padding: 0; justify-content: flex-end; }
.rsheet .busy { display: flex; align-items: center; }

#toast { position: fixed; z-index: 60; left: 50%; bottom: 1.4em; transform: translate(-50%, 200%);
  background: var(--ink); color: var(--bg); padding: .7em 1.2em; border-radius: 12px; font-weight: 600;
  transition: transform .35s; display: flex; gap: 1em; align-items: center; }
#toast.on { transform: translate(-50%, 0); }
#toast button { color: var(--accent); font-weight: 800; }
body.night #toast button { color: #10201c; }
#offline { position: fixed; z-index: 55; right: .7em; bottom: .6em; width: .6em; height: .6em; border-radius: 50%;
  background: #d8a01e; }
</style>

<script>
'use strict';
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon = id => `<svg><use href="#${id}"/></svg>`;

const IDLE_TO_SAVER_MS = 90e3;     // dashboard → pictures after this long untouched
const recipeIdleMs = () => (config.recipeIdleMin || 45) * 60e3;   // …much longer on the Recipes tab
const SLIDE_MS = 40e3;
const PALETTE = ['--c1','--c2','--c3','--c4','--c5','--c6'];

let config = {}, mode = 'saver', view = 'week', asleep = false, lastTouch = Date.now();
let weather = null;

async function api(path, opts = {}) {
  const r = await fetch(path, { headers: { 'Content-Type': 'application/json' }, ...opts,
    body: opts.body ? JSON.stringify(opts.body) : undefined });
  if (!r.ok) throw new Error(`${path}: ${r.status}`);
  return r.json();
}
function setOffline(off) { $('#offline').classList.toggle('hidden', !off); }

/* ── clock + theme ─────────────────────────────── */
function tick() {
  const d = new Date();
  const t = d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
  $$('[data-clock]').forEach(e => e.textContent = t);
  $$('[data-date]').forEach(e => e.textContent = d.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'short' }));
  $$('[data-datelong]').forEach(e => e.textContent = d.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' }));
  const h = d.getHours();
  document.body.classList.toggle('night', h >= 20 || h < 7);
}

function wxIcon(name, isDay = true) { return icon(name === 'sun' && !isDay ? 'w-moon' : 'w-' + name); }
function renderWeather() {
  if (!weather) return;
  $$('[data-wx]').forEach(e => e.innerHTML = `· ${weather.temp}°`);
  const today = weather.days?.[0];
  $$('[data-wxlong]').forEach(e => e.innerHTML =
    `${wxIcon(weather.icon, weather.isDay)}<b>${weather.temp}°</b>` +
    (today ? `<small>${today.max}° / ${today.min}°${today.rain >= 30 ? ` · ${today.rain}% rain` : ''}</small>` : ''));
}

/* ── busy + weather poll ───────────────────────── */
let busySince = null, lastWake = false, pageVersion = null;
async function pollState() {
  try {
    const s = await api('/api/state');
    setOffline(false);
    const on = !!s.busy?.on;
    if (on && !document.body.classList.contains('busy')) kiosk('wake');
    document.body.classList.toggle('busy', on);
    busySince = on && s.busy.since ? new Date(s.busy.since) : null;
    renderBusySince();
    renderAlerts(s.alerts || []);
    if (s.weather) { weather = s.weather; renderWeather(); }
    if (s.version) {                                   // new deploy: reload when nobody is mid-task
      pageVersion ??= s.version;
      if (s.version !== pageVersion && mode === 'saver' && !document.querySelector('.modal:not(.hidden)')) location.reload();
    }
    if (s.wake && !lastWake) kiosk('wake');            // e.g. someone walked into the kitchen
    const shown = s.showRecipe?.at || 0;                // sent from the phone page ("show it in the kitchen")
    if (lastShowAt === null) lastShowAt = shown;         // one sent before this page loaded stays put
    else if (shown > lastShowAt) {
      lastShowAt = shown;
      if (!document.querySelector('.modal:not(.hidden)') && !document.body.classList.contains('cooking')) {
        kiosk('wake'); showDash('recipes'); openRecipe(s.showRecipe.id);
      }
    }
    lastWake = !!s.wake;
  } catch { setOffline(true); }
}
function renderAlerts(list) {
  const since = t => { const m = Math.round((Date.now() - new Date(t)) / 60000); return t && m >= 1 ? `<small>${m < 60 ? m + ' min' : Math.floor(m / 60) + ' h'}</small>` : ''; };
  const html = list.map(a => `<span class="al">${icon('i-bolt-off')}${esc(a.label)}${since(a.since)}</span>`).join('');
  $$('.alerts').forEach(el => { if (el.innerHTML !== html) el.innerHTML = html; });
}
function renderBusySince() {
  if (!busySince) { $('#busy-since').textContent = ''; return; }
  const m = Math.max(0, Math.round((Date.now() - busySince) / 60000));
  $('#busy-since').textContent = m < 1 ? 'just now' : `${m} min`;
}

/* ── modes ─────────────────────────────────────── */
function showSaver() {
  setSaverPanel(false);
  if (!$('#pin').classList.contains('hidden')) $('#pin').click();   // cancels a PIN prompt left open
  $('#ce-cancel').click();                                           // and the chore editor
  closeColour();
  closeRSheet(); $('#cook').classList.add('hidden');                  // cook mode comes back with the dashboard
  if (['INPUT', 'TEXTAREA'].includes(document.activeElement?.tagName)) document.activeElement.blur();
  mode = 'saver';
  $('#dash').classList.add('hidden');
  $('#saver').classList.remove('hidden');
  if (!asleep) nextSlide(true);
}
function showDash(v) {
  mode = 'dash';
  lastTouch = Date.now();
  $('#saver').classList.add('hidden');
  $('#dash').classList.remove('hidden');
  clearTimeout(slideTimer);
  setView(v || view);
  if (view === 'recipes' && recipe && document.body.classList.contains('cooking')) $('#cook').classList.remove('hidden');
}
function setView(v) {
  view = v;
  $$('nav button').forEach(b => b.classList.toggle('on', b.dataset.view === v));
  $$('.view').forEach(s => s.classList.toggle('hidden', s.id !== 'v-' + v));
  $('#legend').classList.toggle('hidden', v !== 'week');
  if (v === 'week') loadWeek();
  else if (v === 'music') { loadMusic(); loadFavs(); }
  else if (v === 'home') loadHome();
  else if (v === 'todo') loadTodo();
  else if (v === 'pocket') loadPocket();
  else if (v === 'recipes') { if (!recipe) loadRecipes(); }
  else loadList(v);
}

/* screensaver taps: first tap shows the music panel (if something's loaded); a tap anywhere else then opens the dashboard */
let saverPanelOpen = false, saverPanelTimer;
const musicLoaded = () => music && music.title && ['playing', 'paused'].includes(music.state);
function setSaverPanel(open) {
  saverPanelOpen = open && musicLoaded();
  $('#saver-music').classList.toggle('hidden', !saverPanelOpen);
  clearTimeout(saverPanelTimer);
  if (saverPanelOpen) saverPanelTimer = setTimeout(() => setSaverPanel(false), 12e3);
}
$('#saver').addEventListener('click', () => {
  if (!saverPanelOpen && musicLoaded()) { setSaverPanel(true); return; }
  setSaverPanel(false); showDash();
});
$('#to-saver').addEventListener('click', showSaver);
$$('nav button').forEach(b => b.addEventListener('click', () => setView(b.dataset.view)));
['pointerdown', 'keydown'].forEach(ev => document.addEventListener(ev, () => lastTouch = Date.now(), true));
setInterval(() => {
  const typing = ['INPUT', 'TEXTAREA'].includes(document.activeElement?.tagName) && document.activeElement.value;
  const idle = Date.now() - lastTouch;
  if (mode === 'dash' && !typing && !rBusy && !timers.length && idle > (view === 'recipes' ? recipeIdleMs() : IDLE_TO_SAVER_MS)) showSaver();
}, 5e3);
/* cooking: the kiosk app dims the screen after its own timeout (10 min); a wake() resets that clock.
   Keep it awake while a timer runs, Claude is working, or the Recipes tab was touched within its idle time. */
setInterval(() => {
  if (timers.length || rBusy || (mode === 'dash' && view === 'recipes' && Date.now() - lastTouch < recipeIdleMs())) kiosk('wake');
}, 60e3);

/* battery: from the kiosk app's status; shown only while running on battery */
function pollBattery() {
  let st = null;
  try { st = JSON.parse(window.Kiosk?.status?.() || 'null'); } catch {}
  const show = st && st.battery != null && !st.plugged;
  $$('[data-batt]').forEach(el => {
    el.classList.toggle('hidden', !show);
    if (!show) return;
    el.classList.toggle('low', st.battery <= 20);
    el.innerHTML = `<span class="cell"><i style="width:${Math.max(4, st.battery)}%"></i></span>${st.battery}%`;
    el.title = 'Running on battery — plug the tablet in';
  });
}

/* kiosk app bridge (Android wrapper); harmless in a normal browser */
function kiosk(cmd) { try { window.Kiosk?.[cmd]?.(); } catch {} }
window.addEventListener('kiosk', e => {
  if (!e.detail?.state) return;                      // printer events carry `printer`, not `state`
  asleep = e.detail.state === 'asleep';
  if (asleep) { showSaver(); clearTimeout(slideTimer); }
  else if (mode === 'saver') nextSlide(true);
});

/* ── slideshow ─────────────────────────────────── */
let slides = [], slideIdx = -1, slideTimer = null, front = $('#sa'), back = $('#sb');
async function loadSlides() {
  try { const s = await api('/api/slides'); if (s.length) { slides = s; slideIdx = -1; } } catch {}
}
function captionFor(s) {
  if (s.kind === 'art') return `<div class="a">${esc(s.artist)}</div><div class="t">${esc(s.title)}${s.date ? ', ' + esc(s.date) : ''}</div>`;
  const when = s.taken ? new Date(s.taken).toLocaleDateString('en-GB', { month: 'long', year: 'numeric' }) : '';
  return `<div class="a">${esc(when)}</div><div class="t">${esc(s.place)}</div>`;
}
function nextSlide(immediate) {
  clearTimeout(slideTimer);
  if (mode !== 'saver' || asleep) return;
  if (!slides.length) { slideTimer = setTimeout(() => nextSlide(true), 5e3); return; }
  if (immediate && front.classList.contains('on')) { slideTimer = setTimeout(nextSlide, SLIDE_MS); return; }
  slideIdx = (slideIdx + 1) % slides.length;
  const s = slides[slideIdx];
  const img = back;
  img.onload = () => {
    // photos fill the screen; paintings are never cropped
    img.classList.toggle('cover', s.kind === 'photo' && img.naturalWidth > img.naturalHeight);
    img.classList.add('on'); front.classList.remove('on');
    [front, back] = [img, front];
    $('#caption').innerHTML = captionFor(s);
    slideTimer = setTimeout(nextSlide, SLIDE_MS);
  };
  img.onerror = () => { slideTimer = setTimeout(nextSlide, 1e3); };
  img.src = s.src;
}

/* ── week ──────────────────────────────────────── */
const dayKey = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
function isoLocal(d) {
  const off = -d.getTimezoneOffset(), sign = off >= 0 ? '+' : '-', a = Math.abs(off);
  return `${dayKey(d)}T00:00:00${sign}${String(a/60|0).padStart(2,'0')}:${String(a%60).padStart(2,'0')}`;
}
let calColors = {};
async function loadWeek() {
  const start = new Date(); start.setHours(0, 0, 0, 0);
  const days = [...Array(7)].map((_, i) => new Date(start.getFullYear(), start.getMonth(), start.getDate() + i));
  const end = new Date(start.getFullYear(), start.getMonth(), start.getDate() + 7);
  let data = { events: [], calendars: [] };
  try {
    data = await api(`/api/calendar?start=${encodeURIComponent(isoLocal(start))}&end=${encodeURIComponent(isoLocal(end))}`);
    setOffline(false);
  } catch { setOffline(true); }
  data.calendars.forEach((c, i) => calColors[c.label] = c.color || `var(${PALETTE[i % PALETTE.length]})`);
  $('#legend').innerHTML = data.calendars.length > 1
    ? data.calendars.map(c => `<span style="--c:${calColors[c.label]}"><i></i>${esc(c.label)}</span>`).join('') : '';

  const now = new Date();
  const wxByDate = Object.fromEntries((weather?.days || []).map(w => [w.date, w]));
  $('#week').innerHTML = days.map((d, i) => {
    const k = dayKey(d), dEnd = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1);
    const evs = data.events.filter(e => {
      if (e.allDay) return e.start <= k && k < e.end;          // end date is exclusive
      const s = new Date(e.start), en = new Date(e.end);
      return s < dEnd && en > d;
    });
    const w = wxByDate[k];
    const head = `<h3>${i === 0 ? 'Today' : i === 1 ? 'Tomorrow' : d.toLocaleDateString('en-GB', { weekday: 'long' })}` +
      `<div class="row"><b>${d.getDate()}</b>${w ? `<span class="wxd">${wxIcon(w.icon)}${w.max}°</span>` : ''}</div></h3>`;
    const body = evs.length ? evs.map(e => {
      const c = calColors[e.calendar] || 'var(--c2)';
      if (e.allDay) return `<div class="ev all" style="--c:${c}"><div class="ti">${esc(e.title)}</div></div>`;
      const s = new Date(e.start), en = new Date(e.end);
      const tm = s < d ? 'cont.' : s.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
      return `<div class="ev${en < now ? ' past' : ''}" style="--c:${c}"${e.recipe ? ` data-recipe="${esc(e.recipe)}"` : ''}><div class="tm">${tm}</div><div class="ti">${esc(e.title)}</div></div>`;
    }).join('') : `<div class="none">—</div>`;
    return `<div class="day${i === 0 ? ' today' : ''}">${head}<div class="evs">${body}</div></div>`;
  }).join('') + (data.unconfigured ? `<div class="empty-note" style="position:absolute;inset:auto 0 45%;">No calendar connected yet</div>` : '');
}

$('#week').addEventListener('click', e => { const ev = e.target.closest('[data-recipe]'); if (ev) openRecipe(ev.dataset.recipe); });

/* ── lists ─────────────────────────────────────── */
const lists = {};
async function loadList(kind, data) {
  try { lists[kind] = data || await api(`/api/list/${kind}`); setOffline(false); }
  catch { setOffline(true); return; }
  renderList(kind);
}
function renderList(kind) {
  const l = lists[kind];
  if (!l) return;
  if (kind !== 'shopping') { renderTodoTabs(); if (kind !== todoSel) return; }
  const sec = kind === 'shopping' ? $('#v-shopping') : $('#v-todo');
  if (kind === 'shopping') {
    const badge = $('[data-count="shopping"]');
    badge.textContent = l.items.length; badge.classList.toggle('hidden', !l.items.length);
  }
  $('h2 .n', sec).textContent = l.items.length ? `· ${l.items.length}` : '';
  $('.items', sec).innerHTML = l.items.length
    ? l.items.map(i => `<div class="item" data-id="${esc(i.id)}"><span class="box">${icon('i-tick')}</span><span class="tx">${esc(i.text)}</span><button class="del" aria-label="Remove">${icon('i-x')}</button></div>`).join('')
    : `<div class="none">${kind === 'shopping' ? 'Nothing to buy 🎉' : 'All done 🎉'}</div>`;
  const chips = $('.chips', sec);
  if (!chips) return;
  chips.innerHTML = l.recent.length
    ? `<div class="lbl">${kind === 'shopping' ? 'Bought before — tap to add again' : 'Done before'}</div>` +
      l.recent.slice(0, 40).map(t => `<button class="chip">${esc(t)}</button>`).join('')
    : kind === 'shopping' ? `<div class="lbl">Things you tick off show up here, so you can add them again with one tap.</div>` : '';
}

const pendingDone = new Map();
$$('.listview').forEach(sec => {
  let kind;                                          // the to-do view switches section, so read it per event
  sec.addEventListener('click', () => kind = sec.dataset.kind, true);
  sec.addEventListener('submit', () => kind = sec.dataset.kind, true);
  $('.items', sec).addEventListener('click', async e => {
    const row = e.target.closest('.item'); if (!row) return;
    const id = row.dataset.id;
    if (e.target.closest('.del')) {                  // remove outright (mistakes), with undo
      const text = $('.tx', row).textContent;
      row.classList.add('gone');
      try {
        await loadList(kind, await api(`/api/list/${kind}/${id}`, { method: 'DELETE' }));
        toast(`Removed “${text}”`, async () => loadList(kind, await api(`/api/list/${kind}`, { method: 'POST', body: { text } })));
      } catch { row.classList.remove('gone'); toast("Couldn't remove — try again"); }
      return;
    }
    if (pendingDone.has(id)) {                       // second tap = undo
      clearTimeout(pendingDone.get(id)); pendingDone.delete(id);
      row.classList.remove('ticked'); return;
    }
    row.classList.add('ticked');
    pendingDone.set(id, setTimeout(async () => {
      row.classList.add('gone');
      try { await loadList(kind, await api(`/api/list/${kind}/${id}/done`, { method: 'POST', body: { done: true } })); }
      catch { row.classList.remove('ticked', 'gone'); toast("Couldn't save — try again"); }
      pendingDone.delete(id);
    }, 2500));
  });
  $('.add', sec).addEventListener('submit', async e => {
    e.preventDefault();
    const input = $('input', sec), text = input.value.trim();
    if (!text) { input.blur(); return; }
    input.value = '';
    try { await loadList(kind, await api(`/api/list/${kind}`, { method: 'POST', body: { text } })); }
    catch { input.value = text; toast("Couldn't add — try again"); }
  });
  $('.chips', sec)?.addEventListener('click', async e => {
    const chip = e.target.closest('.chip'); if (!chip) return;
    chip.remove();
    try { await loadList(kind, await api(`/api/list/${kind}`, { method: 'POST', body: { text: chip.textContent } })); }
    catch { toast("Couldn't add — try again"); }
  });
  $('.print', sec)?.addEventListener('click', async () => {
    if (!lists[kind]?.items.length) { toast('The list is empty'); return; }
    if (blePrinter()) { printLocal(shoppingReceipt(lists[kind].items)); return; }
    try {
      const r = await api(`/api/list/${kind}/print`, { method: 'POST' });
      toast(r.ok ? 'Printing…' : `Printer: ${r.result}`);
    } catch { toast("Couldn't reach the printer"); }
  });
});

/* ── to-do sections ─────────────────────────────── */
let todoSections = [], todoSel = null;
async function loadTodo() {
  let d;
  try { d = await api('/api/todo'); setOffline(false); } catch { setOffline(true); return; }
  todoSections = d.sections.map(x => ({ id: x.id, label: x.label, pinned: x.pinned }));
  d.sections.forEach(x => lists[x.id] = { items: x.items, recent: x.recent });
  if (!todoSections.some(x => x.id === todoSel)) todoSel = todoSections[0]?.id || null;
  selectTodo(todoSel);
}
function selectTodo(id) {
  todoSel = id;
  const sec = $('#v-todo'); sec.dataset.kind = id || '';
  const label = todoSections.find(x => x.id === id)?.label || 'To do';
  $('#todo-title').textContent = label;
  $('input', sec).placeholder = `Add to ${label}…`;
  renderTodoTabs();
  if (id) renderList(id);
}
function renderTodoTabs() {
  const badge = $('[data-count="todo"]');
  const n = todoSections.filter(x => x.pinned).reduce((a, x) => a + (lists[x.id]?.items.length || 0), 0);
  badge.textContent = n; badge.classList.toggle('hidden', !n);
  let lastPinned = true;
  $('#todo-tabs').innerHTML = todoSections.map(x => {
    const c = lists[x.id]?.items.length || 0;
    const sep = lastPinned && !x.pinned ? '<span class="sep"></span>' : '';
    lastPinned = x.pinned;
    return `${sep}<button data-sec="${esc(x.id)}" class="${x.id === todoSel ? 'on' : ''}">${esc(x.label)}${c ? `<i>${c}</i>` : ''}</button>`;
  }).join('');
}
$('#todo-tabs').addEventListener('click', e => {
  const b = e.target.closest('button[data-sec]'); if (b) selectTodo(b.dataset.sec);
});

/* ── pocket money ──────────────────────────────── */
let pocket = null;
const euro = n => '€' + (Math.round((n || 0) * 100) / 100).toFixed(2);
async function loadPocket(data) {
  try { pocket = data || await api('/api/pocket'); setOffline(false); } catch { setOffline(true); return; }
  renderPocket();
}
function renderPocket() {
  if (!pocket?.kids) return;
  $('#pocket-kids').innerHTML = pocket.kids.map(k => {
    const done = k.ticked.length, all = k.chores.length;
    const goals = k.goals.map(g => `<div class="goal"><div class="gl"><span>Saving for <b>${esc(g.name)}</b></span><span>${euro(g.balance)} / ${euro(g.amount)}</span></div><div class="gb"><i style="width:${Math.min(100, g.pct || 0)}%"></i></div></div>`).join('');
    const chores = all ? k.chores.map((c, i) => `<button class="chore${k.ticked.includes(i) ? ' on' : ''}" data-kid="${esc(k.id)}" data-i="${i}"><span class="box">${icon('i-tick')}</span><span class="t">${esc(c)}</span></button>`).join('')
      : `<div class="none">No chores yet — tap ⚙ to add some.</div>`;
    const foot = k.credited ? `<div class="credited">✓ Today's ${euro(k.rate)} is in</div>`
      : `<button class="btn credit" data-kid="${esc(k.id)}">${icon('i-plus')} Add today · ${euro(k.rate)}${all ? ` <small style="opacity:.75;font-weight:500">(${done}/${all} done)</small>` : ''}</button>`;
    return `<div class="kid"><div class="kid-head"><h2>${esc(k.name)}</h2><span class="bal">${euro(k.balance)}</span><button class="gear kprint" data-kid="${esc(k.id)}" aria-label="Print">${icon('i-print')}</button><button class="gear" data-kid="${esc(k.id)}" aria-label="Edit chores">${icon('i-gear')}</button></div>${goals}<div class="chores"><div class="lbl">Today's chores</div>${chores}</div>${foot}</div>`;
  }).join('');
}
$('#pocket-kids').addEventListener('click', async e => {
  const chore = e.target.closest('.chore');
  if (chore) {
    chore.classList.toggle('on');
    try { await loadPocket(await api(`/api/pocket/${chore.dataset.kid}/chore/${chore.dataset.i}`, { method: 'POST', body: {} })); }
    catch { chore.classList.toggle('on'); toast("Couldn't save — try again"); }
    return;
  }
  const credit = e.target.closest('.credit');
  if (credit) {
    const kid = pocket.kids.find(k => k.id === credit.dataset.kid);
    const left = kid.chores.length - kid.ticked.length;
    const pin = await askPin(`Add today for ${kid.name}?${left > 0 ? ` (${left} chore${left > 1 ? 's' : ''} not ticked)` : ''}`,
      p => api(`/api/pocket/${kid.id}/credit`, { method: 'POST', body: { pin: p } }).then(d => { loadPocket(d); return true; }));
    if (pin) toast(`${euro(kid.rate)} added for ${kid.name} 🎉`);
    return;
  }
  const pr = e.target.closest('.kprint');
  if (pr) {
    const kid = pocket.kids.find(k => k.id === pr.dataset.kid);
    if (blePrinter()) { printLocal(pocketReceipt(kid)); return; }
    toast(`Printing ${kid.name}'s pocket money…`);
    try {
      const r = await api(`/api/pocket/${kid.id}/print`, { method: 'POST', body: {} });
      if (!r.ok) toast(`Printer: ${r.error || 'no answer'}`);
    } catch { toast("Couldn't reach the printer"); }
    return;
  }
  const gear = e.target.closest('.gear');
  if (gear) {
    const kid = pocket.kids.find(k => k.id === gear.dataset.kid);
    const pin = await askPin(`Edit ${kid.name}'s chores`, p => api('/api/pocket/pin', { method: 'POST', body: { pin: p } }).then(() => true));
    if (pin) editChores(kid, pin);
  }
});

/* PIN pad: resolves with the PIN once `check(pin)` succeeds, or null on cancel */
function askPin(title, check) {
  if (!config.pocketPinSet) { toast('No parent PIN set on the server yet'); return Promise.resolve(null); }
  return new Promise(resolve => {
    const m = $('#pin'), dots = $('#pin-dots');
    let pin = '';
    $('#pin-title').textContent = title;
    const draw = () => { dots.textContent = '•'.repeat(pin.length); };
    draw(); m.classList.remove('hidden');
    const done = v => { m.classList.add('hidden'); m.onclick = null; resolve(v); };
    m.onclick = async e => {
      if (e.target === m || e.target.closest('.pin-cancel')) return done(null);
      const k = e.target.closest('[data-k]')?.dataset.k; if (!k) return;
      if (k === 'del') pin = pin.slice(0, -1);
      else if (k === 'ok') {
        if (!pin) return;
        try { await check(pin); return done(pin); }
        catch { dots.classList.add('bad'); setTimeout(() => dots.classList.remove('bad'), 400); pin = ''; }
      } else if (pin.length < 8) pin += k;
      draw();
    };
  });
}

function editChores(kid, pin) {
  let list = [...kid.chores];
  const m = $('#chore-edit');
  $('#ce-title').textContent = `${kid.name}'s chores`;
  const draw = () => $('#ce-list').innerHTML = list.length
    ? list.map((c, i) => `<div class="ce-row"><span>${esc(c)}</span><button data-i="${i}" aria-label="Remove">${icon('i-x')}</button></div>`).join('')
    : `<div class="none" style="color:var(--faint)">No chores yet.</div>`;
  draw(); m.classList.remove('hidden');
  $('#ce-list').onclick = e => { const b = e.target.closest('button[data-i]'); if (b) { list.splice(+b.dataset.i, 1); draw(); } };
  $('#ce-add').onsubmit = e => { e.preventDefault(); const inp = $('#ce-add input'); const t = inp.value.trim(); if (t) { list.push(t); inp.value = ''; draw(); } };
  $('#ce-cancel').onclick = () => m.classList.add('hidden');
  $('#ce-save').onclick = async () => {
    const pending = $('#ce-add input').value.trim(); if (pending) { list.push(pending); $('#ce-add input').value = ''; }
    try { await loadPocket(await api(`/api/pocket/${kid.id}/chores`, { method: 'POST', body: { pin, chores: list } })); m.classList.add('hidden'); toast('Chores saved'); }
    catch { toast("Couldn't save — try again"); }
  };
}

/* ── home: lights, TV, plants ──────────────────── */
let home = null, homeHold = 0;                         // homeHold: ignore polls briefly after a tap
let nightArm = 0;                                      // Night needs a second tap within 4 s
async function loadHome() {
  if (Date.now() < homeHold) return;
  try { home = await api('/api/home'); } catch { if (!home) home = { groups: [], media: [], plants: [] }; }
  renderHome();
}
const homeLightAt = el => { const [g, i] = el.closest('.light').dataset.i.split('-'); return home.groups[+g].lights[+i]; };
function renderHome() {
  if (!home) return;
  $('#lights').innerHTML = (config.hasNight ? `<div class="nightbar"><button class="btn ghost${nightArm > Date.now() ? ' arm' : ''}" data-night>${icon('w-moon')}${nightArm > Date.now() ? 'Tap again: all off but the night lamps' : 'Night'}</button></div>` : '') + (home.groups || []).map((g, gi) => {
    const dimmable = g.lights.filter(l => l.kind === 'light' && !l.solo).length >= 2;
    return `<div class="lgroup"><div class="lhead"><h2>${esc(g.title)}</h2>${dimmable ? `<span class="all">
        <button class="btn ghost" data-all="off" data-g="${gi}">Off</button><button class="btn ghost" data-all="dim" data-g="${gi}">Dim</button><button class="btn" data-all="on" data-g="${gi}">All on</button></span>` : ''}</div>
      <div class="lgrid">${g.lights.map((l, i) => `
        <div class="light${l.on ? ' on' : ''}${l.mode === 'moon' ? ' moon' : ''}${l.moonId && (l.colour || l.temps) ? ' wide' : ''}${l.available ? '' : ' na'}" data-i="${gi}-${i}">
          <button class="tap"><span class="ic">${icon(l.mode === 'moon' ? 'w-moon' : l.kind === 'switch' ? 'i-power' : 'i-bulb')}</span><span><div class="nm">${esc(l.name)}</div>
            <div class="st">${!l.available ? 'Unavailable' : l.on ? (l.mode === 'moon' ? 'Moonlight' + (l.pct != null ? ' ' + l.pct + '%' : '') : (l.effect ? fxName(l.effect) + ' · ' : '') + (l.pct != null ? l.pct + '%' : 'On')) : 'Off'}</div></span></button>
          ${l.dimmable || l.colour || l.temps || l.moonId ? `<div class="ctl">${l.dimmable ? `<div class="dim"><i style="width:${l.on ? (l.pct ?? 100) : 0}%"></i><b>${l.on ? (l.pct ?? 100) + '%' : ''}</b></div>` : ''}${l.colour || l.temps
            ? `<button class="clr${l.colour ? '' : ' wt'}" aria-label="Colour"><i${l.on && (l.rgb || l.k) ? ` style="background:${l.rgb ? `rgb(${l.rgb})` : kelvinCss(l.k)}"` : ''}></i></button>` : ''}${l.moonId
            ? `<button class="mode" aria-label="${l.mode === 'moon' ? 'Daylight' : 'Moonlight'}">${icon(l.mode === 'moon' ? 'w-sun' : 'w-moon')}</button>` : ''}</div>` : ''}
        </div>`).join('')}</div></div>`;
  }).join('') || '<div class="none">No lights set (HOME_LIGHTS)</div>';
  const media = home.media || [];
  $('#media-card').classList.toggle('hidden', !media.length);
  $('#media').innerHTML = media.map((m, i) => {
    const na = ['unavailable', 'unknown', 'off', 'standby'].includes(m.state), playing = m.state === 'playing';
    const st = m.state === 'unavailable' ? 'Unavailable' : [m.state[0].toUpperCase() + m.state.slice(1), m.app, m.title].filter(Boolean).join(' · ');
    return `<div class="mp${na ? ' na' : ''}"><div class="tx"><div class="nm">${esc(m.name)}</div><div class="st">${esc(st)}</div></div>
      <button data-m="${i}" aria-label="Play or pause"${na ? ' disabled' : ''}>${icon(playing ? 'i-pause' : 'i-play')}</button></div>`;
  }).join('');
  const dry = home.plantDry ?? 20;
  $('#plants').innerHTML = (home.plants || []).map(p => {
    const m = p.moisture, thirsty = m != null && m < dry;
    return `<div class="plant${thirsty ? ' dry' : ''}">
      <div class="nm">${icon('i-leaf')}${esc(p.name)}</div>
      <div class="pc">${m != null ? Math.round(m) : '–'}<small>%</small></div>
      <div class="bar"><i style="width:${Math.max(0, Math.min(100, m ?? 0))}%"></i></div>
      <div class="meta">${thirsty ? '<span class="thirsty">Needs water</span>' : '<span>Soil moisture</span>'}
        ${p.temp != null ? `<span>${p.temp.toFixed(1)} °C</span>` : ''}
        ${p.battery != null && p.battery < 20 ? `<span>Battery ${Math.round(p.battery)}%</span>` : ''}</div>
    </div>`;
  }).join('') || '<div class="none">No plants set (HOME_PLANTS)</div>';
}
async function homePost(path, body, optimistic) {
  homeHold = Date.now() + 2500;
  if (optimistic) { optimistic(); renderHome(); }
  try { await api(path, { method: 'POST', body }); } catch { toast("Couldn't reach Home Assistant"); homeHold = 0; }
  setTimeout(() => { homeHold = 0; loadHome(); }, 1200);
}
$('#lights').addEventListener('click', e => {
  if (e.target.closest('[data-night]')) {
    if (nightArm < Date.now()) { nightArm = Date.now() + 4000; renderHome(); setTimeout(renderHome, 4100); return; }
    nightArm = 0;
    homePost('/api/home/night', {}, () => home.groups.forEach(g => g.lights.forEach(l => { if (!NIGHT_KEEP_UI(l)) l.on = false; })));
    toast('Good night');
    return;
  }
  const all = e.target.closest('[data-all]');
  if (all) {
    const a = all.dataset.all, g = +all.dataset.g;
    homePost('/api/home/light', { all: a, group: g }, () => home.groups[g].lights.filter(l => l.kind === 'light' && (a === 'off' || !l.solo))
      .forEach(l => { l.on = a !== 'off'; l.pct = a === 'on' ? 100 : a === 'dim' ? 20 : l.pct; }));
    return;
  }
  const t = e.target.closest('.tap'); if (!t) return;

/* colour: whites for colour-temperature lights, pastels for colour lights */
const WHITES = [[2200, 'Candle'], [2700, 'Warm'], [4000, 'Neutral'], [6000, 'Cool']];

const rKey = id => 'recipe:' + id;

const saveRState = () => { try { localStorage.setItem(rKey(recipe.id), JSON.stringify(rState)); } catch {} };
const factor = () => recipe?.serves && rState?.serves ? rState.serves / recipe.serves : 1;

/* quantities: scale the number at the start of an ingredient ("1 1/2 cups", "200 g", "½ onion") */
const VULGAR = { '½': .5, '⅓': 1 / 3, '⅔': 2 / 3, '¼': .25, '¾': .75, '⅛': .125 };

function parseQty(s) {

  for (const part of s.split(/\s+/)) {

    else { const m = part.match(/^(\d+(?:[.,]\d+)?)?([½⅓⅔¼¾⅛])?$/); if (m) n += (m[1] ? parseFloat(m[1].replace(',', '.')) : 0) + (m[2] ? VULGAR[m[2]] : 0); }
  }

}
function fmtQty(n, rest) {

  if (n >= 10) return String(Math.round(n));
  const whole = Math.floor(n), fr = n - whole;
  const [v, ch] = [[0, ''], [.25, '¼'], [1 / 3, '⅓'], [.5, '½'], [2 / 3, '⅔'], [.75, '¾'], [1, '']]
    .reduce((a, b) => Math.abs(b[0] - fr) < Math.abs(a[0] - fr) ? b : a);
  return `${(whole + (v === 1 ? 1 : 0)) || ''}${ch}` || '¼';
}
/* → [quantity, rest] with the quantity scaled to the chosen servings ('' when the line has none) */
function scaledParts(text) {
  const m = text.match(QTY); if (!m) return ['', text];
  const f = factor(), rest = text.slice(m[0].length);
  if (f === 1) return [m[0], rest];
  // the amount in brackets too: "200 g rice (250 ml)", "1 onion (about 150 g)"
  const inner = rest.replace(/\(([^)]*)\)/, (all, x) => '(' + x.replace(/(\d+(?:[.,]\d+)?|[½⅓⅔¼¾⅛])(\s*)(kg|g|ml|l|tbsp|tsp)\b/i,
    (_, q, sp, u) => fmtQty(parseQty(q) * f, ' ' + u) + sp + u) + ')');
  return [fmtQty(parseQty(m[1]) * f, rest) + (m[3] ? '–' + fmtQty(parseQty(m[3]) * f, rest) : ''), /^\s/.test(inner) ? inner : ' ' + inner];
}
