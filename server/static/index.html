const scaledText = text => scaledParts(text).join('');

/* timers in step text: "20 minutes", "1 hour 15 minutes", "8-10 mins", "30 seconds" */
const DUR = /(\d+(?:[.,]\d+)?)\s*(?:(?:-|–|to)\s*(\d+(?:[.,]\d+)?)\s*)?(hours?|hrs?|minutes?|mins?|seconds?|secs?)\b(?:\s*(?:and\s*)?(\d+)\s*(?:minutes?|mins?)\b)?/gi;
function stepHtml(text, si) {
  let i = 0;
  return esc(text).replace(DUR, (all, a, b, unit, extraMin) => {
    const mul = /^h/i.test(unit) ? 3600 : /^m/i.test(unit) ? 60 : 1;
    const secs = Math.round(parseFloat(a.replace(',', '.')) * mul + (extraMin ? +extraMin * 60 : 0));
    if (!secs || secs > 24 * 3600) return all;
    return `<button class="tmr" data-secs="${secs}" data-label="${esc(`Step ${si + 1}: ${all}`)}">${icon('i-timer')}${all}</button>`;
  });
}

function renderRecipe() {
  const r = recipe, f = factor(), have = new Set(rState.have);
  let sec = null;
  const ings = r.ingredients.map((g, i) => {
    const head = g.section && g.section !== sec ? `<h3>${esc(g.section)}</h3>` : ''; sec = g.section;
    return `${head}<button class="ing${have.has(i) ? ' on' : ''}" data-i="${i}"><span class="box">${icon('i-tick')}</span><span class="t">${scaleIng(g.text)}</span></button>`;
  }).join('');
  sec = null;
  const steps = r.steps.map((s, i) => {
    const head = s.section && s.section !== sec ? `<h3>${esc(s.section)}</h3>` : ''; sec = s.section;
    return `${head}<div class="step${i === rState.step ? ' cur' : i < rState.step ? ' done' : ''}" data-s="${i}"><span class="n">${i + 1}</span><span>${stepHtml(s.text, i)}</span></div>`;
  }).join('');
  const times = [r.prep_min && `Prep ${mins(r.prep_min)}`, r.cook_min && `Cook ${mins(r.cook_min)}`, !r.prep_min && !r.cook_min && r.total_min && mins(r.total_min)].filter(Boolean).join(' · ');
  $('#r-view').innerHTML = `
    <div class="rhead">
      <button class="back" data-r="back" aria-label="All recipes">${icon('i-back')}</button>
      <h2>${esc(r.title)}<small>${esc([times, r.serves ? '' : r.servings, r.source_name].filter(Boolean).join(' · '))}</small></h2>
      ${r.serves ? `<span class="scale"><button data-r="less" aria-label="Fewer">−</button><span>Serves ${rState.serves}${f !== 1 ? ` <small style="color:var(--dim)">(×${+f.toFixed(2)})</small>` : ''}</span><button data-r="more" aria-label="More">+</button></span>` : ''}
      <button class="btn${r.saved ? ' ghost' : ''}" data-r="save">${r.saved ? '♥ Saved' : '♡ Save'}</button>
      ${config.hasClaude ? `<button class="btn ghost" data-r="change">${icon('i-spark')}Change</button>` : ''}
      ${config.mealPlan && r.kind !== 'drink' ? `<button class="btn ghost" data-r="plan">${icon('i-cal')}Plan</button>` : ''}
      <button class="btn ghost" data-r="shop">${icon('i-cart')}Shopping</button>
      ${blePrinter() ? `<button class="btn ghost" data-r="print" aria-label="Print">${icon('i-print')}</button>` : ''}
      <button class="btn ghost" data-r="delete" aria-label="Delete">${icon('i-trash')}</button>
      <button class="btn" data-r="cook">${icon('i-pot')}Start cooking</button>
    </div>
    <div class="rbody">
      <div class="card"><h2>Ingredients <span class="n">· ${r.ingredients.length}</span></h2>${ings || '<div class="none" style="padding:1em">None listed</div>'}</div>
      <div class="card"><h2>Method</h2>
        ${r.note ? `<div class="rnote">${esc(r.note)}</div>` : ''}${r.description && !r.note ? `<div class="rnote">${esc(r.description)}</div>` : ''}
        ${steps}
        ${r.tips?.length ? `<h3>Tips</h3><div class="rtips">${r.tips.map(t => `<div>• ${esc(t)}</div>`).join('')}</div>` : ''}
        ${r.source_url ? `<div class="rsrc">From ${esc(r.source_url)}</div>` : ''}${r.image_credit ? `<div class="rsrc">Photo: ${esc(r.image_credit)} (the dish in general, not this recipe)</div>` : ''}
      </div>
    </div>`;
}
$('#r-view').addEventListener('click', e => {
  const t = e.target.closest('.tmr'); if (t) { e.stopPropagation(); startTimer(+t.dataset.secs, t.dataset.label); return; }
  const ing = e.target.closest('.ing');
  if (ing) { const i = +ing.dataset.i; rState.have = rState.have.includes(i) ? rState.have.filter(x => x !== i) : [...rState.have, i]; saveRState(); renderRecipe(); return; }
  const st = e.target.closest('.step');
  if (st) { rState.step = +st.dataset.s; saveRState(); renderRecipe(); return; }
  const b = e.target.closest('[data-r]'); if (!b) return;
  const a = b.dataset.r;
  if (a === 'back') closeRecipe();
  else if (a === 'less' || a === 'more') { rState.serves = Math.max(1, Math.min(40, rState.serves + (a === 'more' ? 1 : -1))); saveRState(); renderRecipe(); }
  else if (a === 'cook') openCook();
  else if (a === 'save') {
    const want = !recipe.saved; recipe.saved = want; renderRecipe();
    api(`/api/recipes/${recipe.id}/save`, { method: 'POST', body: { saved: want } })
      .then(() => toast(want ? 'Saved' : 'Moved back to Recent'))
      .catch(() => { recipe.saved = !want; renderRecipe(); toast("Couldn't save — try again"); });
  }
  else if (a === 'change') changeSheet();
  else if (a === 'shop') shopSheet();
  else if (a === 'plan') planSheet();
  else if (a === 'print') printSheet();
  else if (a === 'delete') deleteSheet();
});

/* sheets: change, shopping, delete */
function rSheet(html) { $('#r-sheet-body').innerHTML = html; $('#r-sheet').classList.remove('hidden'); }
function closeRSheet() { $('#r-sheet').classList.add('hidden'); }
$('#r-sheet').addEventListener('click', e => { if (e.target.id === 'r-sheet' || e.target.closest('[data-x]')) closeRSheet(); });
const CHANGES = ['Metric, weights and volumes', 'Make it vegetarian', 'No oven (hob only)', 'Air fryer', 'Quicker, under 30 min', 'Kid-friendly, less spicy', 'Dairy-free', 'Gluten-free', 'Use what I have: …'];
const DRINK_CHANGES = ['Make it a mocktail', 'Kid-friendly and fun', 'A jug for 8', 'Less sweet', 'Without a shaker', 'Use what I have: …'];
function changeSheet() {
  rSheet(`<h2>Change “${esc(recipe.title)}”</h2>
    <div class="chips">${(recipe.kind === 'drink' ? DRINK_CHANGES : CHANGES).map(c => `<button class="chip">${esc(c)}</button>`).join('')}</div>
    <div class="rnew" style="padding:0"><textarea id="r-ask" placeholder="e.g. for 6 people, swap the cream for yoghurt"></textarea></div>
    <div class="busy hidden" id="r-cbusy" style="gap:.6em;color:var(--accent);font-weight:700"><svg style="animation:spin .9s linear infinite"><use href="#i-refresh"/></svg><span></span></div>
    <div class="hint" style="color:var(--dim);font-size:.85rem">Claude writes a changed copy; the original stays in Saved.</div>
    <div class="actions"><button class="btn ghost" data-x>Cancel</button><button class="btn" id="r-change-go">${icon('i-spark')}Change it</button></div>`);
  $('.rsheet .chips').onclick = e => { const c = e.target.closest('.chip'); if (!c) return; const ta = $('#r-ask'); ta.value = c.textContent.replace(': …', ': '); ta.focus(); };
  $('#r-change-go').onclick = () => {
    const ask = $('#r-ask').value.trim(); if (!ask) { toast('Say how to change it'); return; }
    const from = recipe.id;
    recipeRequest(`/api/recipes/${from}/change`, { ask }, 'Changing the recipe…', () => toast('Saved as a new version; the original is still there'), '#r-cbusy');
  };
}
function shopSheet() {
  const items = recipe.ingredients.map((g, i) => ({ i, name: g.item || g.text })).filter(x => x.name);
  const have = new Set(rState.have), pick = new Set(items.filter(x => !have.has(x.i)).map(x => x.i));
  const draw = () => {
    $('.rsheet .items').innerHTML = items.map(x => `<div class="item${pick.has(x.i) ? ' ticked' : ''}" data-i="${x.i}" style="text-decoration:none"><span class="box">${icon('i-tick')}</span><span class="tx" style="text-decoration:none;color:inherit">${esc(x.name)}</span></div>`).join('');
    $('#r-shop-go').innerHTML = `${icon('i-cart')}Add ${pick.size}`;
  };
  rSheet(`<h2>Add to the shopping list</h2><div class="hint" style="color:var(--dim);font-size:.85rem">Ticked ones go on the list. Ingredients you ticked as “have it” start unticked.</div>
    <div class="items"></div><div class="actions"><button class="btn ghost" data-x>Cancel</button><button class="btn" id="r-shop-go"></button></div>`);
  draw();
  $('.rsheet .items').onclick = e => { const row = e.target.closest('.item'); if (!row) return; const i = +row.dataset.i; pick.has(i) ? pick.delete(i) : pick.add(i); draw(); };
  $('#r-shop-go').onclick = async () => {
    const names = items.filter(x => pick.has(x.i)).map(x => x.name); if (!names.length) { closeRSheet(); return; }
    closeRSheet(); let n = 0;
    for (const text of names) { try { await api('/api/list/shopping', { method: 'POST', body: { text } }); n++; } catch {} }
    loadList('shopping');
    toast(n === names.length ? `Added ${n} to the shopping list` : `Added ${n} of ${names.length}; the rest failed`);
  };
}
function planSheet() {
  const days = [...Array(8)].map((_, i) => { const d = new Date(); d.setDate(d.getDate() + i); return d; });
  const meals = config.mealTimes || ['Dinner'];
  let day = 0, meal = meals[meals.length - 1];
  const draw = () => {
    $('.plan-days').innerHTML = days.map((d, i) => `<button data-d="${i}" class="${i === day ? 'on' : ''}">${i === 0 ? 'Today' : i === 1 ? 'Tomorrow' : d.toLocaleDateString('en-GB', { weekday: 'short' })}<small>${d.getDate()} ${d.toLocaleDateString('en-GB', { month: 'short' })}</small></button>`).join('');
    $('.plan-meals').innerHTML = meals.map(m => `<button data-m="${esc(m)}" class="${m === meal ? 'on' : ''}">${esc(m)}</button>`).join('');
  };
  rSheet(`<h2>Plan “${esc(recipe.title)}”</h2><div class="plan-days"></div><div class="plan-meals"></div>
    <div class="actions"><button class="btn ghost" data-x>Cancel</button><button class="btn ghost" id="pl-shop">${icon('i-cart')}Plan + shopping</button><button class="btn" id="pl-go">${icon('i-cal')}Add to calendar</button></div>`);
  draw();
  $('.plan-days').onclick = e => { const b = e.target.closest('[data-d]'); if (b) { day = +b.dataset.d; draw(); } };
  $('.plan-meals').onclick = e => { const b = e.target.closest('[data-m]'); if (b) { meal = b.dataset.m; draw(); } };
  const go = async shop => {
    const d = days[day], date = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    try {
      await api(`/api/recipes/${recipe.id}/plan`, { method: 'POST', body: { date, meal, serves: rState.serves } });
      toast(`${meal} ${day === 0 ? 'today' : day === 1 ? 'tomorrow' : 'on ' + d.toLocaleDateString('en-GB', { weekday: 'long' })}: on the calendar`);
      if (shop) shopSheet(); else closeRSheet();
    } catch { toast("Couldn't add it to the calendar"); }
  };
  $('#pl-go').onclick = () => go(false);
  $('#pl-shop').onclick = () => go(true);
}
function deleteSheet() {
  rSheet(`<h2>Delete “${esc(recipe.title)}”?</h2><div class="actions"><button class="btn ghost" data-x>Keep it</button><button class="btn" id="r-del-go" style="background:var(--busy)">${icon('i-trash')}Delete</button></div>`);
  $('#r-del-go').onclick = async () => {
    closeRSheet();
    try { await api(`/api/recipes/${recipe.id}`, { method: 'DELETE' }); localStorage.removeItem(rKey(recipe.id)); closeRecipe(); toast('Deleted'); }
    catch { toast("Couldn't delete — try again"); }
  };
}

/* cook mode */
let cookIngs = false;
function openCook() { $('#cook').classList.remove('hidden'); document.body.classList.add('cooking'); renderCook(); }
function closeCook() { $('#cook').classList.add('hidden'); document.body.classList.remove('cooking'); if (recipe && !$('#r-view').classList.contains('hidden')) renderRecipe(); }
function renderCook() {
  const r = recipe, n = r.steps.length, i = Math.min(rState.step, n - 1), s = r.steps[i] || { text: 'No steps in this recipe.' };
  const have = new Set(rState.have);
  $('#cook').innerHTML = `
    <div class="top"><button data-c="close" aria-label="Close">${icon('i-x')}</button><span class="t">${esc(r.title)}</span>
      <button class="ingb" data-c="ings">${cookIngs ? 'Hide ingredients' : 'Ingredients'}</button></div>
    <div class="mid${cookIngs ? ' withings' : ''}">
      ${cookIngs ? `<div class="ings">${r.ingredients.map((g, k) => `<button class="ing${have.has(k) ? ' on' : ''}" data-i="${k}"><span class="box">${icon('i-tick')}</span><span class="t">${scaleIng(g.text)}</span></button>`).join('')}</div>` : ''}
      <div><div class="sec">${esc(s.section || '')}</div><div class="num">Step ${i + 1} of ${n}</div><div class="txt">${stepHtml(s.text, i)}</div></div>
    </div>
    <div class="bot"><button class="btn ghost" data-c="prev" ${i === 0 ? 'style="visibility:hidden"' : ''}>${icon('i-back')}Back</button>
      <div class="dots">${r.steps.map((_, k) => `<i class="${k <= i ? 'on' : ''}"></i>`).join('')}</div>
      <button class="btn" data-c="next">${i >= n - 1 ? `${icon('i-tick')}Done` : `Next${icon('i-fwd')}`}</button></div>`;
}
function cookStep(d) {
  const n = recipe.steps.length;
  if (d > 0 && rState.step >= n - 1) { rState.step = 0; saveRState(); closeCook(); toast('Enjoy! 🍽'); return; }
  rState.step = Math.max(0, Math.min(n - 1, rState.step + d)); saveRState(); renderCook();
}
$('#cook').addEventListener('click', e => {
  const t = e.target.closest('.tmr'); if (t) { startTimer(+t.dataset.secs, t.dataset.label); return; }
  const ing = e.target.closest('.ing');
  if (ing) { const k = +ing.dataset.i; rState.have = rState.have.includes(k) ? rState.have.filter(x => x !== k) : [...rState.have, k]; saveRState(); renderCook(); return; }
  const b = e.target.closest('[data-c]'); if (!b) return;
  const c = b.dataset.c;
  if (c === 'close') closeCook(); else if (c === 'ings') { cookIngs = !cookIngs; renderCook(); }
  else cookStep(c === 'next' ? 1 : -1);
});
let swipeX = null;                                     // swipe left/right between steps (messy fingers)
$('#cook').addEventListener('pointerdown', e => { swipeX = e.target.closest('button, .ings') ? null : e.clientX; });
$('#cook').addEventListener('pointerup', e => {
  if (swipeX == null) return; const dx = e.clientX - swipeX; swipeX = null;
  if (Math.abs(dx) > 80) cookStep(dx < 0 ? 1 : -1);
});

/* timers */
let timers = [], audio = null, tid = 0;
function startTimer(secs, label) {
  try { audio ||= new (window.AudioContext || window.webkitAudioContext)(); audio.resume?.(); } catch {}
  timers.push({ id: ++tid, label, end: Date.now() + secs * 1000, ring: 0 });
  toast(`Timer set: ${fmtLeft(secs * 1000)}`); renderTimers();
}
const fmtLeft = ms => { const s = Math.max(0, Math.ceil(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
  return h ? `${h}:${String(m).padStart(2, '0')}:${String(x).padStart(2, '0')}` : `${m}:${String(x).padStart(2, '0')}`; };
function beep() {
  if (!audio) return;
  const t0 = audio.currentTime;
  [0, .25, .5].forEach(dt => { const o = audio.createOscillator(), g = audio.createGain(); o.frequency.value = 880; o.connect(g); g.connect(audio.destination);
    g.gain.setValueAtTime(.0001, t0 + dt); g.gain.exponentialRampToValueAtTime(.5, t0 + dt + .02); g.gain.exponentialRampToValueAtTime(.0001, t0 + dt + .2);
    o.start(t0 + dt); o.stop(t0 + dt + .22); });
}
function renderTimers() {
  const now = Date.now();
  document.body.classList.toggle('timing', timers.length > 0);
  $('#timers').innerHTML = timers.map(t => `<button data-t="${t.id}" class="${t.end <= now ? 'ring' : ''}">${icon('i-timer')}${t.end <= now ? 'Done!' : fmtLeft(t.end - now)}<small>${esc(t.label.replace(/^Step \d+: /, ''))}</small></button>`).join('');
}
setInterval(() => {
  if (!timers.length) return;
  const now = Date.now();
  for (const t of timers) if (t.end <= now) {
    if (!t.ring) { kiosk('wake'); toast(`⏰ ${t.label}`); }
    if (t.ring++ < 180) beep();                         // rings for 3 minutes, then just stays red
  }
  renderTimers();
}, 1000);
$('#timers').addEventListener('click', e => {
  const b = e.target.closest('[data-t]'); if (!b) return;
  const t = timers.find(x => x.id === +b.dataset.t); if (!t) return;
  if (t.end <= Date.now()) { timers = timers.filter(x => x !== t); renderTimers(); return; }
  rSheet(`<h2>${esc(t.label)}</h2><div style="font-size:2.4rem;font-weight:300">${fmtLeft(t.end - Date.now())}</div>
    <div class="actions"><button class="btn ghost" id="t-cancel">Stop timer</button><button class="btn ghost" id="t-plus">+1 min</button><button class="btn" data-x>OK</button></div>`);
  $('#t-cancel').onclick = () => { timers = timers.filter(x => x !== t); renderTimers(); closeRSheet(); };
  $('#t-plus').onclick = () => { t.end += 60e3; renderTimers(); closeRSheet(); };
});

function recipeReceipt(r, whole) {
  return receipt(p => {
    p.text(r.title, 32, 800, { align: 'center' });
    if (r.serves) p.text(`Serves ${rState.serves}`, 20, 400, { align: 'center' });
    p.rule();
    r.ingredients.forEach(g => p.box(scaledText(g.text), false, 22));
    if (!whole) return;
    p.rule();
    r.steps.forEach((s, i) => p.text(`${i + 1}. ${s.text}`, 20, 400, { gap: 4 }).space(6));
  });
}
/* printing a whole recipe uses a lot of paper and the button is easy to brush: ask first, and say how long */
function printSheet() {
  const jobs = [false, true].map(whole => ({ whole, png: recipeReceipt(recipe, whole) }));
  Promise.all(jobs.map(j => new Promise(ok => { const im = new Image(); im.onload = () => ok(Math.round(im.height / 80)); im.onerror = () => ok(null); im.src = j.png; })))
    .then(([short, long]) => {                          // 203 dpi printer: ~80 px per cm
      const cm = n => n ? ` · about ${n} cm` : '';
      rSheet(`<h2>Print “${esc(recipe.title)}”?</h2>
        <div class="hint" style="color:var(--dim);font-size:.9rem">The printer can't stop once it starts, so pick the one you want.</div>
        <div class="actions" style="flex-wrap:wrap"><button class="btn ghost" data-x>Cancel</button>
          <button class="btn ghost" id="p-short">${icon('i-cart')}Ingredients${cm(short)}</button>
          <button class="btn" id="p-long">${icon('i-print')}Whole recipe${cm(long)}</button></div>`);
      $('#p-short').onclick = () => { closeRSheet(); printLocal(jobs[0].png); };
      $('#p-long').onclick = () => { closeRSheet(); printLocal(jobs[1].png); };
    });
}

/* ── receipts for the Bluetooth printer (384 px wide, drawn here, printed by the kiosk app) ── */
const RW = 384, FONT = 'Roboto, system-ui, sans-serif';
function receipt(draw) {
  const c = document.createElement('canvas'); c.width = RW; c.height = 4000;
  const g = c.getContext('2d');
  g.fillStyle = '#fff'; g.fillRect(0, 0, RW, c.height); g.fillStyle = '#000'; g.strokeStyle = '#000'; g.textBaseline = 'top';
  const r = { g, y: 8,
    font(px, w = 400) { g.font = `${w} ${px}px ${FONT}`; return this; },
    wrap(text, maxW) {
      const out = []; let line = '';
      for (const word of String(text).split(/\s+/)) {
        const t = line ? line + ' ' + word : word;
        if (g.measureText(t).width > maxW && line) { out.push(line); line = word; } else line = t;
      }
      return line ? [...out, line] : out;
    },
    text(t, px, w = 400, { x = 8, align = 'left', gap = 6, maxW = RW - 16 } = {}) {
      this.font(px, w); g.textAlign = align;
      for (const ln of this.wrap(t, maxW)) { g.fillText(ln, align === 'center' ? RW / 2 : align === 'right' ? RW - 8 : x, this.y); this.y += px + gap; }
      g.textAlign = 'left'; return this;
    },
    row(left, right, px = 22, w = 400) {          // "label ........ value"
      this.font(px, w); g.textAlign = 'right'; g.fillText(right, RW - 8, this.y);
      const rw = g.measureText(right).width; g.textAlign = 'left';
      const l = this.wrap(left, RW - 32 - rw)[0] || ''; g.fillText(l, 8, this.y); this.y += px + 8; return this;
    },
    rule(dashed = true) { g.setLineDash(dashed ? [6, 5] : []); g.lineWidth = 2; g.beginPath(); g.moveTo(8, this.y + 6); g.lineTo(RW - 8, this.y + 6); g.stroke(); g.setLineDash([]); this.y += 16; return this; },
    box(t, ticked, px = 26) {
      this.font(px); const s = px - 4;
      g.lineWidth = 3; g.strokeRect(10, this.y + 2, s, s); if (ticked) g.fillRect(14, this.y + 6, s - 8, s - 8);
      const lines = this.wrap(t, RW - 30 - s);
      lines.forEach((ln, i) => g.fillText(ln, 22 + s, this.y + i * (px + 4)));
      this.y += lines.length * (px + 4) + 10; return this;
    },
    bar(pct) { g.lineWidth = 2; g.strokeRect(8, this.y, RW - 16, 16); g.fillRect(8, this.y, (RW - 16) * Math.min(1, Math.max(0, pct / 100)), 16); this.y += 26; return this; },
    space(h = 10) { this.y += h; return this; },
  };
  draw(r);
  r.space(6).text(new Date().toLocaleString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }), 18, 400, { align: 'center' });
  const out = document.createElement('canvas'); out.width = RW; out.height = r.y + 8;
  out.getContext('2d').drawImage(c, 0, 0);
  return out.toDataURL('image/png');
}
function shoppingReceipt(items) {
  return receipt(r => {
    r.text('Shopping', 40, 800, { align: 'center' }).rule();
    items.forEach(i => r.box(i.text, false));
  });
}
function pocketReceipt(k) {
  return receipt(r => {
    r.text(k.name, 40, 800, { align: 'center' }).text(euro(k.balance), 56, 800, { align: 'center', gap: 4 });
    r.text(`${k.daysThisWeek} day${k.daysThisWeek === 1 ? '' : 's'} earned this week`, 20, 400, { align: 'center' }).rule();
    k.goals.forEach(gl => { r.row(gl.name, `${euro(gl.balance)} / ${euro(gl.amount)}`, 22, 700); r.bar(gl.pct || 0); });
    if (k.chores.length) { r.space(4).text("Today's chores", 22, 700); k.chores.forEach((c, i) => r.box(c, k.ticked.includes(i), 24)); }
    if (k.recent.length) { r.rule().text('Recent', 22, 700); k.recent.forEach(m => r.row(m.name, (m.amount > 0 ? '+' : '−') + euro(Math.abs(m.amount)), 20)); }
  });
}

/* Bluetooth printer in the kiosk app, if there is one */
function blePrinter() {
  try { const st = JSON.parse(window.Kiosk?.printerStatus?.() || 'null'); return st && st.enabled ? st : null; } catch { return null; }
}
function printLocal(dataUrl) {
  const r = window.Kiosk.printImage(dataUrl);
  toast(r === 'queued' ? 'Printing…' : `Printer: ${r}`);
}
window.addEventListener('kiosk', e => {
  if (e.detail?.printer === 'error') toast(e.detail.message || 'Printing failed');
});

let toastTimer, toastUndo = null;
function toast(msg, undo) {
  const t = $('#toast'); $('span', t).textContent = msg; t.classList.add('on');
  toastUndo = undo || null;
  $('button', t).classList.toggle('hidden', !undo);
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.classList.remove('on'); toastUndo = null; }, undo ? 5000 : 3000);
}
$('#toast button').addEventListener('click', async () => {
  const fn = toastUndo; toastUndo = null; $('#toast').classList.remove('on');
  if (fn) try { await fn(); } catch { toast("Couldn't undo"); }
});

/* ── boot ──────────────────────────────────────── */
(async () => {
  try { config = await api('/api/config'); } catch {}
  $('#busy-label').textContent = config.busyLabel || 'On a call';
  tick(); setInterval(tick, 1e3);
  pollState(); setInterval(pollState, 4e3);
  pollBattery(); setInterval(pollBattery, 30e3);
  setInterval(renderBusySince, 30e3);
  await loadSlides(); setInterval(loadSlides, 3600e3);
  loadList('shopping'); loadTodo();
  if (config.hasPocket) $('#nav-pocket').classList.remove('hidden');
  if (config.hasHome) {
    $('#nav-home').classList.remove('hidden');
    setInterval(() => { if (mode === 'dash' && view === 'home') loadHome(); }, 3e3);
  }
  if (config.hasMusic) {
    $('#nav-music').classList.remove('hidden');
    loadMusic();
    setInterval(() => { if (mode === 'dash' && view === 'music') loadMusic(); }, 3e3);
    setInterval(() => { if (!(mode === 'dash' && view === 'music')) loadMusic(); }, 8e3);
  }
  setInterval(() => {                                  // keep badges + open view fresh
    if (!pendingDone.size) { loadList('shopping'); loadTodo(); }
    if (mode === 'dash' && view === 'pocket') loadPocket();
    if (mode === 'dash' && view === 'week') loadWeek();
  }, 60e3);
  if (location.hash === '#dash') showDash(); else showSaver();
})();
</script>
