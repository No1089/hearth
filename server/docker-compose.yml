services:
  hearth:
    image: python:3.13-slim
    container_name: hearth
    network_mode: host
    volumes:
      - ./app.py:/app/app.py:ro
      - ./static:/app/static:ro
      - ./data:/app/data
    working_dir: /app
    command: sh -c "pip install flask websockets --quiet --root-user-action=ignore && python app.py"
    env_file: deploy.env
    restart: unless-stopped
